<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Bindaas" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
  <meta name="theme-color" content="#230C0F">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Get in touch with Bindaas — let's build something together." />
  <title>Contact | BINDAAS</title>

  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://kit.fontawesome.com/b29129bf0d.js" crossorigin="anonymous"></script>
</head>

<body>
  <!-- Header Placeholder - Loaded via includes.js -->
  <div id="header-placeholder"></div>

  <!-- Contact Section -->
  <section class="contact-section" id="contact" style="padding-top: var(--header-height, 140px);">
    <div class="contact-container">
      <div class="contact-content">
        <h1 class="contact-title">Let's Build Together</h1>
        <p class="contact-intro">We'd love to hear from you! Tell us about your next project and we'll take it from there.</p>
        <form id="contact-form" class="contact-form">
          <div class="form-row">
            <div class="form-group">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" name="first_name" required>
            </div>
            <div class="form-group">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" name="last_name" required>
            </div>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="form-submit">
            <span class="btn-fill"></span>
            <span class="btn-text">
              <span class="btn-label">Send Message</span>
              <span class="btn-label-hover">Send Message</span>
            </span>
          </button>
          <div id="form-message" class="form-message"></div>
        </form>
      </div>
      <div class="contact-side">
        <div class="contact-image">
          <img src="/assets/images/260217 Bindaas Founder Shoot_AV_39.jpg" alt="Working together">
        </div>
      </div>
    </div>
  </section>

  <!-- Footer Placeholder - Loaded via includes.js -->
  <div id="footer-placeholder"></div>

  <script src="/js/includes.js"></script>
  <script src="/js/script.js"></script>
  <script src="/js/contact-form.js"></script>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>

</html>
